<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parkpuram Offline Parking</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body>
  <div class="min-h-screen bg-gray-100 flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-white rounded-lg shadow-md overflow-hidden">
      <div class="bg-blue-600 text-white py-4 px-6">
        <h2 class="text-2xl font-bold text-center">Parkpuram Offline Parking</h2>
        <p class="text-center mt-1 text-blue-100">Please enter your details below</p>
      </div>
      <form id="parkingForm" class="p-6">
        <div class="space-y-4">
          <div>
            <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
            <input id="email" type="email" placeholder="Enter your email" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label for="vehicleNo" class="block text-sm font-medium text-gray-700 mb-1">Vehicle Number</label>
            <input id="vehicleNo" type="text" placeholder="Enter your vehicle number" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label for="phoneNo" class="block text-sm font-medium text-gray-700 mb-1">Phone Number</label>
            <input id="phoneNo" type="tel" placeholder="Enter your phone number" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
        </div>
        <p id="successMessage" class="mt-4 text-center text-green-600 font-semibold"></p>
        <p id="errorMessage" class="mt-4 text-center text-red-600 font-semibold"></p>
        <button type="button" id="payNowButton" class="w-full mt-6 bg-green-600 text-white py-2 px-4 rounded-md hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-offset-2 transition-colors duration-300">Pay Now</button>
      </form>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
